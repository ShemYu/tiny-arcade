    <div id="playing" hidden><button class="primary switch" id="switch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></svg><span data-copy="switch">SWITCH ORBIT</span></button><p class="hint" data-copy="hint">Tap the orbit, or press Space · P to pause</p></div>

    let rows=state.rows;
    if(preview){rows=[{angle:angle+.65,safe:lane,danger:false},{angle:angle+1.5,safe:1-lane,danger:true},{angle:angle+2.35,safe:1-lane,danger:true},{angle:angle+3.2,safe:lane,danger:true}];}
    for(const row of rows){const ahead=row.angle-angle;const alpha=Math.min(1,Math.max(0,(4.5-ahead)/.6));if(alpha===0)continue;ctx.globalAlpha=alpha;if(row.danger&&!row.hit)gate(row.angle,1-row.safe,alpha);if(!row.collected&&!row.judged){const p=point(row.angle,row.safe);if(ahead>0&&ahead<1){ctx.strokeStyle='#adf0d345';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.stroke();}diamond(p.x,p.y,5,C.mint);}ctx.globalAlpha=1;}
    if((state.status==='playing'||preview)&&!reduced){const p=point(angle,lane);trail.push({...p,life:.24});if(trail.length>30)trail.shift();}
    for(const p of trail){p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/.24)*.35;ctx.fillStyle=C.mint;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();}trail=trail.filter(p=>p.life>0);ctx.globalAlpha=1;
    ship(angle,lane,state.invincible>0&&Math.floor(state.invincible*10)%2? .3:1);
    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.max(0,p.life/p.total);ctx.fillStyle=p.color;ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;
    // Direction marker makes the clockwise motion legible without relying on sound.
    if(preview||state.time<6){const p=point(angle+.3,lane);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle+.3);line(-3,-3,1,0,C.muted);line(1,0,-3,3,C.muted);ctx.restore();}
    ctx.restore();
    if(flash>0&&!reduced){ctx.fillStyle=`rgba(255,148,110,${flash*.12})`;ctx.fillRect(0,0,w,h);}
    shake=Math.max(0,shake-dt*25);flash=Math.max(0,flash-dt*4);
  }
  function notify(text,seconds=2){$('notice').textContent=text;noticeUntil=clock+seconds;}
  function updateHUD(){
    $('score').textContent=String(state.score).padStart(4,'0');$('best').textContent=String(best);
    $('time').textContent=String(Math.max(0,Math.ceil(60-state.time)));
    $('life').setAttribute('aria-label',`${state.hp} ${t('shields')}`);
    [...$('life').children].forEach((e,i)=>e.classList.toggle('off',i>=state.hp));
    $('phase').textContent=state.status==='ready'?t('ready'):t('phases')[Math.min(2,Math.floor(state.time/20))];
    $('chain').textContent=state.status==='ready'?t('tagline'):`${t('chain')} ${state.chain} / ×${G.multiplier(state)}`;
  }
  function updateOverlay(){
    const paused=state.status==='paused', won=state.status==='won';
    $('overline').textContent=t(paused?'overPause':won?'overWon':'overLost');
    $('overlay-title').textContent=t(paused?'paused':won?'won':'lost');
    $('result-score').hidden=paused;$('result-meta').hidden=paused;
    $('result-score').textContent=String(state.score);$('collected').textContent=state.collected;
    $('longest').textContent=state.maxChain;$('survived').textContent=`${state.time.toFixed(1)}s`;
    $('record').hidden=paused||!newBest;$('record').textContent=t('newBest');
    $('result-note').textContent=paused?t('pausedNote'):won?t('winNote').replace('{n}',state.bonus):t('loseNote');
    $('again').textContent=t(paused?'resume':'retry');$('restart').hidden=!paused;
    $('after-hint').textContent=t(paused?'pauseHint':'after');
  }
  function syncUI(){
    const ready=state.status==='ready', playing=state.status==='playing', overlay=!ready&&!playing;
    $('intro').hidden=!ready;$('playing').hidden=!playing;$('after').hidden=!overlay;
    $('overlay').hidden=!overlay;$('center').hidden=overlay;$('pause').disabled=!playing;
    $('sound').setAttribute('aria-pressed',String(muted));$('sound').setAttribute('aria-label',t(muted?'soundOff':'soundOn'));
    $('mute-line').style.display=muted?'block':'none';$('pause').setAttribute('aria-label',t('pause'));
    if(overlay)updateOverlay();updateHUD();
  }
  function localize(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';$('language').textContent=lang==='zh'?'EN':'中';$('language').setAttribute('aria-label',lang==='zh'?'Switch to English':'切換為繁體中文');document.querySelectorAll('[data-copy]').forEach(e=>e.textContent=t(e.dataset.copy));$('instructions').innerHTML=t('instructions');canvas.setAttribute('aria-label',t('canvas'));syncUI();}
  function nextSeed(){try{return crypto.getRandomValues(new Uint32Array(1))[0];}catch{return Date.now()>>>0;}}
  function begin(){openAudio();state=G.create(nextSeed());G.start(state);particles=[];trail=[];phase=0;shake=0;flash=0;countdown=0;newBest=false;last=performance.now();syncUI();notify(t('warmup'),2.7);$('switch').focus({preventScroll:true});tone(523,.16);tone(784,.22,'sine',.09,.3);}
  function act(){if(countdown>0)return;openAudio();if(G.switchLane(state))sound('switch');}
  function hold(){if(state.status!=='playing')return;G.pause(state);countdown=0;syncUI();$('notice').textContent='';if(audio)audio.suspend().catch(()=>{});$('again').focus({preventScroll:true});}
  function continueFlight(){if(state.status!=='paused')return;openAudio();G.resume(state);countdown=.75;last=performance.now();syncUI();notify('3',.75);$('switch').focus({preventScroll:true});}
  function finish(){newBest=state.score>best;if(newBest){best=state.score;storage.set('lumenLoopBest',String(best));}sound(state.status==='won'?'win':'lose');syncUI();$('notice').textContent='';$('again').focus({preventScroll:true});}
  function frame(now){
    const dt=Math.min(.05,Math.max(0,(now-last)/1000||0));last=now;clock+=dt;
    if(state.status==='ready'&&!reduced)demo+=dt*.45;
    if(countdown>0){countdown=Math.max(0,countdown-dt);$('notice').textContent=countdown?String(Math.ceil(countdown*4)):'';}
    else if(state.status==='playing'){
      G.step(state,dt);
      for(const e of state.events){if(e.type==='collect'){burst(e.angle,e.lane,C.mint);sound('collect');if(state.chain>0&&state.chain%8===0)notify(t('boost')+G.multiplier(state),1.1);}else if(e.type==='hit'){burst(e.angle,e.lane,C.orange,22);shake=4;flash=1;sound('hit');notify(t('hit'),1.4);}else if(e.type==='end')finish();}
      state.events.length=0;
      const nextPhase=Math.min(2,Math.floor(state.time/20));if(nextPhase!==phase&&state.status==='playing'){phase=nextPhase;notify(t('phases')[phase],2);tone(392,.25);tone(784,.25,'sine',.12,.25);}
      if(state.time>2.7&&state.time<2.75&&state.switches===0)notify(t('change'),2);
      updateHUD();
    }
    if(clock>noticeUntil&&countdown===0)$('notice').textContent='';
    render(state.status==='paused'?0:dt);requestAnimationFrame(frame);
  }
  $('start').addEventListener('click',begin);$('switch').addEventListener('click',act);
  arena.addEventListener('pointerdown',e=>{if(e.isPrimary&&e.button===0&&state.status==='playing'){e.preventDefault();act();}});
  $('again').addEventListener('click',()=>state.status==='paused'?continueFlight():begin());$('restart').addEventListener('click',begin);
  $('pause').addEventListener('click',hold);
  $('sound').addEventListener('click',()=>{muted=!muted;storage.set('lumenLoopMuted',muted?'1':'0');if(muted&&audio)audio.suspend().catch(()=>{});else openAudio();syncUI();});
  $('language').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';storage.set('tinyArcadeLang',lang);localize();});
  document.addEventListener('keydown',e=>{
    if(e.repeat){if(['Space','Enter','ArrowLeft','ArrowRight','Escape','KeyP','KeyM'].includes(e.code))e.preventDefault();return;}
    if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();if(state.status==='playing')hold();else if(state.status==='paused')continueFlight();return;}
    if(e.code==='KeyM'){$('sound').click();return;}
    // Preserve native keyboard activation for toolbar buttons and the back link.
    const focused=e.target.closest('button,a');
    if(focused&&(focused.closest('.top')||focused.id==='restart'))return;
    if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowLeft'||e.code==='ArrowRight'){
      e.preventDefault();if(state.status==='ready'){if(e.code==='Space'||e.code==='Enter')begin();}
      else if(state.status==='playing')act();else if(state.status==='paused')continueFlight();else if(e.code==='Space'||e.code==='Enter')begin();
    }
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)hold();});window.addEventListener('blur',hold);window.addEventListener('pagehide',hold);
  // Read-only diagnostic snapshot: no production cheats or state mutation surface.
  window.lumenSnapshot=()=>({status:state.status,time:state.time,score:state.score,hp:state.hp,lane:state.lane,target:state.target,angle:state.angle,chain:state.chain,collected:state.collected,seed:state.seed,countdown,rows:state.rows.map(r=>({...r})),muted});
  localize();resize();requestAnimationFrame(frame);
})();
</script>
</body>
