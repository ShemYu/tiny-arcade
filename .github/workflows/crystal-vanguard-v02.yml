name: Crystal Vanguard v0.2

on:
  pull_request:
    paths:
      - "games/crystal-vanguard/v0.2/**"
      - "games/crystal-vanguard/assets/**"
      - "games/crystal-vanguard/art/**"
      - "games/crystal-vanguard/asset-manifest.json"
      - "games/crystal-vanguard/README.md"
      - "tools/game-assets/**"
      - ".github/workflows/crystal-vanguard-v02.yml"
  push:
    branches:
      - main
    paths:
      - "games/crystal-vanguard/v0.2/**"
      - "games/crystal-vanguard/assets/**"
      - "games/crystal-vanguard/art/**"
      - "games/crystal-vanguard/asset-manifest.json"
      - "games/crystal-vanguard/README.md"
      - "tools/game-assets/**"
      - ".github/workflows/crystal-vanguard-v02.yml"

permissions:
  contents: read

jobs:
  content-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset-QA dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Test and audit sprite contracts
        run: |
          python -m unittest discover -s tools/game-assets/tests -v
          python tools/game-assets/validate_game_assets.py games/crystal-vanguard/asset-manifest.json --qa-mode declared --report /tmp/blade-report.json
          python tools/game-assets/render_sprite_qa.py games/crystal-vanguard/asset-manifest.json /tmp/blade-report.json /tmp/blade-qa

      - name: Run Crystal Vanguard v0.2 tests
        working-directory: games/crystal-vanguard/v0.2
        run: npm test
